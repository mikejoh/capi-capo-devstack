# secret0 broker chain, PoC: OpenBao mints a fresh, project-scoped OpenStack
# Application Credential on every refresh via vault-plugin-secrets-openstack;
# ESO reshapes it into a clouds.yaml Secret CAPO can consume. No static
# per-cluster OpenStack user/password anywhere in this chain.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: capo-poc-openstack-creds
  namespace: capo-poc
spec:
  path: "openstack/creds/capo-poc-member"
  method: GET
  resultType: Data
  provider:
    server: "http://openbao.openbao.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "eso"
        # No secretRef/serviceAccountRef: ESO authenticates to OpenBao using
        # its own controller ServiceAccount token — no static token for
        # this leg of the chain either.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capo-poc-clouds
  namespace: capo-poc
spec:
  refreshInterval: 60s # ~50% of the openstack/config/lease ttl=120s
  target:
    name: capo-poc-clouds
    template:
      engineVersion: v2
      data:
        clouds.yaml: |
          clouds:
            openstack:
              auth:
                auth_url: "http://192.168.11.77/identity/v3"
                application_credential_id: "{{ .application_credential_id }}"
                application_credential_secret: "{{ .application_credential_secret }}"
              auth_type: "v3applicationcredential"
              region_name: "RegionOne"
              identity_api_version: 3
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: capo-poc-openstack-creds
