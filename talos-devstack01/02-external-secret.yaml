# Same secret0 broker chain as capo-poc/01-external-secret.yaml and
# k8s-devstack01/02-external-secret.yaml.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: talos-devstack01-openstack-creds
  namespace: talos-devstack01
spec:
  path: "openstack/creds/talos-devstack01-member"
  method: GET
  resultType: Data
  provider:
    server: "http://openbao.openbao.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "eso"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-devstack01-clouds
  namespace: talos-devstack01
spec:
  refreshInterval: 60s
  target:
    name: talos-devstack01-clouds
    template:
      engineVersion: v2
      data:
        clouds.yaml: |
          clouds:
            openstack:
              auth:
                auth_url: "http://192.168.11.77/identity/v3"
                application_credential_id: "{{ .application_credential_id }}"
                application_credential_secret: "{{ .application_credential_secret }}"
              auth_type: "v3applicationcredential"
              region_name: "RegionOne"
              identity_api_version: 3
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: talos-devstack01-openstack-creds
