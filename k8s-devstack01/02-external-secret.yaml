# Same secret0 broker chain as capo-poc/01-external-secret.yaml: OpenBao
# mints a fresh, project-scoped Application Credential on every refresh;
# ESO reshapes it into a clouds.yaml Secret CAPO can consume. No static
# per-cluster OpenStack user/password anywhere in this chain.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: k8s-devstack01-openstack-creds
  namespace: k8s-devstack01
spec:
  path: "openstack/creds/k8s-devstack01-member"
  method: GET
  resultType: Data
  provider:
    server: "http://openbao.openbao.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: "kubernetes"
        role: "eso"
        # No secretRef/serviceAccountRef: ESO authenticates to OpenBao using
        # its own controller ServiceAccount token.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-devstack01-clouds
  namespace: k8s-devstack01
spec:
  refreshInterval: 60s # comfortably under the openstack/config/lease ttl=300s
  target:
    name: k8s-devstack01-clouds
    template:
      engineVersion: v2
      data:
        clouds.yaml: |
          clouds:
            openstack:
              auth:
                auth_url: "http://192.168.11.77/identity/v3"
                application_credential_id: "{{ .application_credential_id }}"
                application_credential_secret: "{{ .application_credential_secret }}"
              auth_type: "v3applicationcredential"
              region_name: "RegionOne"
              identity_api_version: 3
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: k8s-devstack01-openstack-creds
