# Full bootable cluster (control plane + workers) — the dynamic-credential
# variant (see step 5 of ../docs/dynamic-openstack-credentials.md) of the
# tutorial's original root k8s-devstack01.yaml: same shape, but
# identityRef points at the OpenStackClusterIdentity from
# 03-cluster-identity.yaml (dynamic, OpenBao-minted credential) instead of a
# static clouds.yaml Secret. Pod CIDR deliberately reuses 192.168.0.0/16 so
# argocd/flannel.yaml and argocd/cilium-values.yaml apply unmodified later.
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: k8s-devstack01-md-0
  namespace: k8s-devstack01
spec:
  template:
    spec:
      files: []
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
            provider-id: openstack:///'{{ instance_id }}'
          name: '{{ local_hostname }}'
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: k8s-devstack01
  namespace: k8s-devstack01
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: k8s-devstack01-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
    name: k8s-devstack01
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: k8s-devstack01-md-0
  namespace: k8s-devstack01
spec:
  clusterName: k8s-devstack01
  replicas: 1
  selector:
    matchLabels: null
  template:
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: k8s-devstack01-md-0
      clusterName: k8s-devstack01
      failureDomain: nova
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: OpenStackMachineTemplate
        name: k8s-devstack01-md-0
      version: v1.36.1
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: k8s-devstack01-control-plane
  namespace: k8s-devstack01
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      controllerManager:
        extraArgs:
        - name: cloud-provider
          value: external
      proxy:
        disabled: true
    files: []
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          provider-id: openstack:///'{{ instance_id }}'
        name: '{{ local_hostname }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          provider-id: openstack:///'{{ instance_id }}'
        name: '{{ local_hostname }}'
  machineTemplate:
    infrastructureRef:
      apiGroup: infrastructure.cluster.x-k8s.io
      kind: OpenStackMachineTemplate
      name: k8s-devstack01-control-plane
  replicas: 1
  version: v1.36.1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: k8s-devstack01
  namespace: k8s-devstack01
spec:
  apiServerLoadBalancer:
    enabled: true
  externalNetwork:
    id: 2979a016-a819-4d07-8e8f-f38633fd4b4d
  identityRef:
    type: ClusterIdentity
    name: k8s-devstack01
    cloudName: openstack
  managedSecurityGroups:
    allNodesSecurityGroupRules:
    - description: Cilium VXLAN overlay (udp/8472)
      direction: ingress
      etherType: IPv4
      name: Cilium VXLAN
      portRangeMax: 8472
      portRangeMin: 8472
      protocol: udp
      remoteManagedGroups:
      - controlplane
      - worker
    - description: Cilium health checks (ICMP)
      direction: ingress
      etherType: IPv4
      name: Cilium health ICMP
      protocol: icmp
      remoteManagedGroups:
      - controlplane
      - worker
    - description: Cilium health checks (tcp/4240)
      direction: ingress
      etherType: IPv4
      name: Cilium health TCP
      portRangeMax: 4240
      portRangeMin: 4240
      protocol: tcp
      remoteManagedGroups:
      - controlplane
      - worker
  managedSubnets:
  - cidr: 10.6.2.0/24
    dnsNameservers:
    - 1.1.1.1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: k8s-devstack01-control-plane
  namespace: k8s-devstack01
spec:
  template:
    spec:
      flavor: m1.medium
      image:
        filter:
          name: ubuntu-2404-kube-v1.36.1
      sshKeyName: k8s-devstack01
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: k8s-devstack01-md-0
  namespace: k8s-devstack01
spec:
  template:
    spec:
      flavor: m1.medium
      image:
        filter:
          name: ubuntu-2404-kube-v1.36.1
      sshKeyName: k8s-devstack01
