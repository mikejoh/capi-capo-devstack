# Infra-only, same as capo-poc/03-openstackcluster.yaml: no
# MachineDeployment/KubeadmControlPlane here. Swap this file for a full
# clusterctl-generated set (with identityRef pointed at the
# OpenStackClusterIdentity above instead of a raw Secret) once you're ready
# to boot real nodes — see step 5 of ../../../docs/dynamic-openstack-credentials.md.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.clusterName }}
spec:
  identityRef:
    type: ClusterIdentity
    name: {{ .Values.clusterName }}
    cloudName: openstack
  managedSubnets:
    - cidr: {{ required "network.managedSubnetCIDR is required" .Values.network.managedSubnetCIDR | quote }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.clusterName }}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: [{{ .Values.network.podCIDR | quote }}]
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
    name: {{ .Values.clusterName }}
