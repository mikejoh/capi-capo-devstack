apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: {{ .Values.clusterName }}-openstack-creds
  namespace: {{ .Values.clusterName }}
spec:
  path: "openstack/creds/{{ .Values.clusterName }}-member"
  method: GET
  resultType: Data
  provider:
    server: {{ .Values.vault.address | quote }}
    auth:
      kubernetes:
        mountPath: {{ .Values.vault.eso.mountPath | quote }}
        role: {{ .Values.vault.eso.role | quote }}
        # No secretRef/serviceAccountRef: ESO authenticates using its own
        # controller ServiceAccount token, shared across every cluster —
        # no per-cluster identity needed for this leg.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-clouds
  namespace: {{ .Values.clusterName }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  target:
    name: {{ .Values.clusterName }}-clouds
    template:
      engineVersion: v2
      data:
        clouds.yaml: |
          clouds:
            openstack:
              auth:
                auth_url: {{ .Values.openstack.authUrl | quote }}
                application_credential_id: "{{ "{{" }} .application_credential_id {{ "}}" }}"
                application_credential_secret: "{{ "{{" }} .application_credential_secret {{ "}}" }}"
              auth_type: "v3applicationcredential"
              region_name: {{ .Values.openstack.regionName | quote }}
              identity_api_version: 3
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: {{ .Values.clusterName }}-openstack-creds
