# PreSync hook: generates the two Secret shells the rest of this pipeline
# needs pre-existing, since neither ORC nor 04-materialize-clouds-job.yaml's
# ServiceAccount can `create` secrets (both only get/patch/update by name —
# see docs/least-privilege-openstack-credentials.md). Runs before any
# Sync-phase resource (the ORC CRDs, RBAC/quota Jobs), regardless of
# sync-wave — that's what the `hook: PreSync` annotation guarantees, unlike
# sync-wave which only orders resources *within* the same phase.
#
# <cluster>-appcred-raw gets a genuinely random value (fresh per apply — the
# ApplicationCredential CR's `resource` spec is immutable, so this Job is not
# safe to blindly re-run once that CR exists and is Available; it's a
# create-if-missing, not an overwrite).
# <cluster>-clouds is just an empty placeholder — content doesn't matter yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-secrets-<cluster>
  namespace: <cluster>
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: secrets-generator
      restartPolicy: Never
      containers:
        - name: generate-secrets
          image: bitnami/kubectl:1.35
          command:
            - sh
            - -c
            - |
              set -eu

              if ! kubectl get secret <cluster>-appcred-raw >/dev/null 2>&1; then
                RANDOM_VALUE=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
                kubectl create secret generic <cluster>-appcred-raw \
                  --from-literal=value="${RANDOM_VALUE}"
                echo "created <cluster>-appcred-raw"
              else
                echo "<cluster>-appcred-raw already exists, leaving it alone"
              fi

              if ! kubectl get secret <cluster>-clouds >/dev/null 2>&1; then
                kubectl create secret generic <cluster>-clouds \
                  --from-literal=clouds.yaml=""
                echo "created <cluster>-clouds"
              else
                echo "<cluster>-clouds already exists, leaving it alone"
              fi
